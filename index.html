<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITARO Backoffice</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%238a6a2c'/%3E%3Ctext x='50' y='69' font-size='58' font-family='Georgia' font-weight='700' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1b1712; --ink-dim:#6e6357;
  --line:rgba(27,23,18,0.12); --brass:#8a6a2c; --brass-bg:rgba(138,106,44,0.12);
  --ok:#2f6b3a; --ok-bg:#dfe9de; --warn:#8a6a1c; --warn-bg:#f3e9d2;
  --crit:#9c3226; --crit-bg:#ecdcd7; --neutral:#5c6470; --neutral-bg:#e4e6ea;
  --shadow:0 1px 3px rgba(27,23,18,0.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161310; --card:#1e1a15; --ink:#ede7da; --ink-dim:#a89e8c;
    --line:rgba(255,255,255,0.1); --brass:#c9a659; --brass-bg:rgba(201,166,89,0.14);
    --ok:#8fb28f; --ok-bg:rgba(143,178,143,0.14); --warn:#e0b654; --warn-bg:rgba(224,182,84,0.14);
    --crit:#d19274; --crit-bg:rgba(209,146,116,0.14); --neutral:#9aa2ad; --neutral-bg:rgba(154,162,173,0.14);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#161310; --card:#1e1a15; --ink:#ede7da; --ink-dim:#a89e8c;
  --line:rgba(255,255,255,0.1); --brass:#c9a659; --brass-bg:rgba(201,166,89,0.14);
  --ok:#8fb28f; --ok-bg:rgba(143,178,143,0.14); --warn:#e0b654; --warn-bg:rgba(224,182,84,0.14);
  --crit:#d19274; --crit-bg:rgba(209,146,116,0.14); --neutral:#9aa2ad; --neutral-bg:rgba(154,162,173,0.14);
  --shadow:none;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 60px;}
.backlink{font-size:.8rem;color:var(--brass);text-decoration:none;font-weight:600;}
.backlink:hover{text-decoration:underline;}
.btn{background:var(--ink);color:var(--paper);border:none;padding:10px 18px;border-radius:6px;font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap;}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.5;cursor:default;}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn-sm{padding:5px 11px;font-size:.74rem;border-radius:5px;}
.btn-danger{background:var(--crit);color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);}
.login-card{max-width:380px;margin:60px auto;padding:30px 32px;}
.login-card h1{font-size:1.3rem;margin-bottom:6px;}
.login-card p{color:var(--ink-dim);font-size:.85rem;margin:0 0 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
.field textarea{min-height:70px;resize:vertical;font-family:inherit;}
.err{color:var(--crit);font-size:.8rem;margin:-4px 0 14px;}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs button{background:none;border:none;padding:10px 16px;font-size:.86rem;font-weight:700;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:0 0 auto;}
.tabs button.active{color:var(--ink);border-bottom-color:var(--brass);}
.tabs .count{margin-left:6px;font-size:.68rem;font-weight:700;background:var(--brass-bg);color:var(--brass);padding:1px 7px;border-radius:10px;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input[type="search"]{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:220px;}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,0.015);white-space:nowrap;}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.86rem;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(138,106,44,0.035);}
.pill{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap;}
.pill-ok{background:var(--ok-bg);color:var(--ok);}
.pill-warn{background:var(--warn-bg);color:var(--warn);}
.pill-neutral{background:var(--neutral-bg);color:var(--neutral);}
.row-actions{display:flex;gap:6px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-dim);}
.cell-sub{color:var(--ink-dim);font-size:.76rem;}
a.link{color:var(--brass);text-decoration:none;font-weight:600;}
a.link:hover{text-decoration:underline;}
.session-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:.78rem;color:var(--ink-dim);flex-wrap:wrap;}
.session-bar .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;}
.session-bar .actions{display:flex;gap:8px;flex:0 0 auto;}
.links-list{list-style:none;margin:0;padding:0;}
.links-list li{border-bottom:1px solid var(--line);}
.links-list li:last-child{border-bottom:none;}
.links-list a{display:block;padding:12px 4px;color:var(--ink);text-decoration:none;font-weight:600;}
.links-list a:hover{color:var(--brass);}
.links-list .desc{display:block;color:var(--ink-dim);font-weight:400;font-size:.78rem;margin-top:2px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,16,10,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal{background:var(--card);border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 30px 70px rgba(0,0,0,.4);}
.modal h2{font-size:1.1rem;margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:8px;font-size:.84rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:200;opacity:0;transform:translateY(10px);transition:opacity .2s ease, transform .2s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
[hidden]{display:none!important;}
@media (max-width:720px){ .field-row{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="wrap">
  <div id="loginView" class="card login-card">
    <h1>Anmelden</h1>
    <p>Zugang zur Backoffice-Datenbank.</p>
    <form id="loginForm">
      <div class="field"><label>E-Mail</label><input type="email" name="email" required autocomplete="username"></div>
      <div class="field"><label>Passwort</label><input type="password" name="password" required autocomplete="current-password"></div>
      <p class="err" id="loginError" hidden></p>
      <button type="submit" class="btn" style="width:100%;">Anmelden</button>
    </form>
  </div>

  <div id="appView" hidden>
    <div class="session-bar">
      <span class="who">Angemeldet als <b id="whoami"></b></span>
      <span class="actions">
        <button type="button" class="btn btn-ghost btn-sm" id="linksBtn">Links</button>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Abmelden</button>
      </span>
    </div>

    <div class="tabs" id="tabs">
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="kunden">Kunden <span class="count" id="countKunden"></span></button>
      <button data-tab="hersteller">Hersteller <span class="count" id="countHersteller"></span></button>
      <button data-tab="geraete">Geräte <span class="count" id="countGeraete"></span></button>
      <button data-tab="montage_partner">Montage-Partner <span class="count" id="countPartner"></span></button>
      <button data-tab="projekte">Projekte <span class="count" id="countProjekte"></span></button>
      <button data-tab="datenabgleich">Datenabgleich</button>
    </div>

    <div id="dashboardHost" hidden></div>
    <div id="syncHost" hidden></div>

    <div class="toolbar" id="toolbar" hidden>
      <input type="search" id="searchInput" placeholder="Suchen …">
      <button type="button" class="btn" id="addBtn">+ Neu</button>
      <button type="button" class="btn-ghost btn btn-sm" id="refreshBtn">Aktualisieren</button>
      <button type="button" class="btn-ghost btn btn-sm" id="exportBtn">Export CSV</button>
      <button type="button" class="btn-ghost btn btn-sm" id="trashToggleBtn">🗑 Papierkorb</button>
      <span id="countLabel" style="margin-left:auto;color:var(--ink-dim);font-size:.8rem;"></span>
    </div>
    <div class="card table-wrap" id="tableCard" hidden>
      <div id="tableHost"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = "https://xgkujmwcumcpibfkvmnr.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_wVMpntBaoBl05u7-x5EySA_JJQg2A-m";
var SESSION_KEY = "vitaroKundenSession";

var STATUS_OPTIONS = ["Interessent","Erstgespräch vereinbart","Angebot erstellt","Kunde","Projekt abgeschlossen"];
var PAKET_OPTIONS = ["","Essential","Signature","Maßgeschneidert"];
var QUELLE_OPTIONS = ["Planer-Registrierung","Kontaktformular","Direktakquise","Sonstige"];
var PROJEKT_STATUS_OPTIONS = ["Angebot","Beauftragt","In Umsetzung","Abgeschlossen"];
var STATUS_PILL = {"Kunde":"ok","Projekt abgeschlossen":"ok","Angebot erstellt":"warn","Erstgespräch vereinbart":"warn","Interessent":"neutral","Abgeschlossen":"ok","In Umsetzung":"warn","Beauftragt":"warn","Angebot":"neutral"};

var TIER_LABELS = { budget:"Einstieg", premium:"Premium" };
var state = { session: null, tab: "dashboard", search: "", sortField: null, sortDir: 1, showArchived: false, kunden: [], hersteller: [], geraete: [], partner: [], projekte: [] };

/* ---------- Sortierung + CSV-Export: Feld-Zugriffe je Tab ---------- */
function fld(v){ return v == null ? "" : v; }
var SORT_ACCESSORS = {
  kunden: {
    name: function(r){ return fld(r.name); }, email: function(r){ return fld(r.email); },
    telefon: function(r){ return fld(r.telefon); }, quelle: function(r){ return fld(r.quelle); },
    status: function(r){ return fld(r.status); }, paket: function(r){ return fld(r.paket); },
    registriertAm: function(r){ return fld(r.registriertAm); }, letzteAktivitaet: function(r){ return fld(r.letzteAktivitaet); }
  },
  hersteller: {
    name: function(r){ return fld(r.name); }, kategorien: function(r){ return fld(r.kategorien); },
    konditionen: function(r){ return fld(r.konditionen); },
    liefert_montage: function(r){ return r.liefert_montage ? 1 : 0; }
  },
  geraete: {
    kategorie: function(r){ return fld(r.kategorie); }, tier: function(r){ return fld(r.tier); },
    modell: function(r){ return fld(r.modell); },
    hersteller: function(r){ return r.hersteller ? r.hersteller.name : ""; },
    preis: function(r){ return r.preis == null ? -1 : Number(r.preis); }
  },
  montage_partner: {
    name: function(r){ return fld(r.name); }, typ: function(r){ return fld(r.typ); },
    gewerk: function(r){ return fld(r.gewerk || r.leistung); }, plz_bereich: function(r){ return fld(r.plz_bereich); }
  },
  projekte: {
    kunde: function(r){ return r.kunden ? r.kunden.name : ""; }, status: function(r){ return fld(r.status); },
    paket: function(r){ return fld(r.paket); }, summe: function(r){ return r.summe == null ? -1 : Number(r.summe); },
    partner: function(r){ return r.montage_partner ? r.montage_partner.name : ""; },
    zustaendig: function(r){ return fld(r.zustaendig); }
  }
};
var CSV_FIELDS = {
  kunden: [["Name","name"],["E-Mail","email"],["Telefon","telefon"],["Quelle","quelle"],["Status","status"],["Paket","paket"],["Registriert","registriertAm"],["Letzte Aktivität","letzteAktivitaet"],["DSGVO-Einwilligung am","dsgvoAm"],["DSGVO-Quelle","dsgvoQuelle"],["Notizen","notizen"]],
  hersteller: [["Name","name"],["Kategorien","kategorien"],["Website","website"],["Ansprechpartner","ansprechpartner"],["Kontakt","kontakt"],["Konditionen","konditionen"],["Liefert Montage",function(r){ return r.liefert_montage ? "Ja" : "Nein"; }],["Montage-Notiz","montage_notiz"]],
  geraete: [["Kategorie","kategorie"],["Stufe",function(r){ return TIER_LABELS[r.tier] || r.tier; }],["Modell","modell"],["Hersteller",function(r){ return r.hersteller ? r.hersteller.name : ""; }],["Preis","preis"],["Website","url"],["Beschreibung","blurb"]],
  montage_partner: [["Name","name"],["Typ","typ"],["Website","website"],["Leistung","leistung"],["PLZ-Bereich","plz_bereich"],["Gewerk","gewerk"],["Kontakt","kontakt"],["Quelle","quelle"],["Notiz","montage_notiz"]],
  projekte: [["Kunde",function(r){ return r.kunden ? r.kunden.name : ""; }],["Kunde E-Mail",function(r){ return r.kunden ? r.kunden.email : ""; }],["Status","status"],["Paket","paket"],["Summe","summe"],["Montage-Partner",function(r){ return r.montage_partner ? r.montage_partner.name : ""; }],["Zuständig","zustaendig"],["Notizen","notizen"]]
};

function escapeHtml(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

/* ---------- Supabase Auth + REST ---------- */
function loadSession(){
  try{ var raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSession(sess){
  state.session = sess;
  try{
    if(sess) localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}
async function login(email, password){
  var res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  });
  var data = await res.json();
  if(!res.ok){ throw new Error(data.error_description || data.msg || "Anmeldung fehlgeschlagen."); }
  saveSession({ access_token: data.access_token, refresh_token: data.refresh_token, email: email });
}
function logout(){ saveSession(null); renderShell(); toast("Abgemeldet."); }

async function refreshToken(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    var res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: state.session.refresh_token })
    });
    var data = await res.json();
    if(!res.ok){ saveSession(null); return false; }
    saveSession({ access_token: data.access_token, refresh_token: data.refresh_token, email: state.session.email });
    return true;
  }catch(e){ return false; }
}
var _refreshPromise = null;
function refreshTokenOnce(){
  if(!_refreshPromise){
    _refreshPromise = refreshToken().then(function(ok){ _refreshPromise = null; return ok; });
  }
  return _refreshPromise;
}
function forceReLogin(){
  if(!state.session) return; // schon abgemeldet, keine doppelte Meldung
  saveSession(null);
  renderShell();
  toast("Sitzung abgelaufen — bitte erneut anmelden.");
}
async function api(path, opts, _retried){
  opts = opts || {};
  var headers = { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  for(var k in (opts.headers || {})) headers[k] = opts.headers[k];
  headers["Authorization"] = "Bearer " + (state.session ? state.session.access_token : SUPABASE_ANON_KEY);
  var res = await fetch(SUPABASE_URL + "/rest/v1" + path, { method: opts.method || "GET", headers: headers, body: opts.body });
  if(res.status === 401 && !_retried){
    var ok = await refreshTokenOnce();
    if(ok) return api(path, opts, true);
    forceReLogin();
  }
  return res;
}

/* ---------- Laden ---------- */
async function loadAll(){
  await Promise.all([loadKunden(), loadHersteller(), loadGeraete(), loadPartner(), loadProjekte()]);
  renderTabs();
  renderActiveTab();
}
function csvCell(v){
  var s = v == null ? "" : String(v);
  if(/[;"\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCsv(){
  var fields = CSV_FIELDS[state.tab];
  if(!fields){ toast("Export für diese Ansicht nicht verfügbar."); return; }
  var rows = currentRows();
  var lines = [fields.map(function(f){ return csvCell(f[0]); }).join(";")];
  rows.forEach(function(r){
    lines.push(fields.map(function(f){
      var val = typeof f[1] === "function" ? f[1](r) : r[f[1]];
      return csvCell(val);
    }).join(";"));
  });
  var csv = "﻿" + lines.join("\r\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "vitaro-" + state.tab + "-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function renderActiveTab(){
  if(state.tab === "dashboard") renderDashboard();
  else if(state.tab === "datenabgleich") renderSyncCheck();
  else renderTable();
}

async function loadGeraete(){
  try{
    var res = await api("/geraete?select=*,hersteller(id,name)&order=kategorie.asc,tier.asc");
    if(!res.ok) throw new Error("HTTP " + res.status);
    state.geraete = await res.json();
  }catch(err){ toast("Fehler beim Laden der Geräte: " + err.message); }
}

async function loadHersteller(){
  try{
    var res = await api("/hersteller?select=*&order=name.asc");
    if(!res.ok) throw new Error("HTTP " + res.status);
    state.hersteller = await res.json();
  }catch(err){ toast("Fehler beim Laden der Hersteller: " + err.message); }
}

async function loadKunden(){
  try{
    var res = await api("/kunden?select=*&order=registriert_am.desc");
    if(!res.ok) throw new Error("HTTP " + res.status);
    state.kunden = (await res.json()).map(function(r){
      return { id:r.id, name:r.name, email:r.email, telefon:r.telefon, quelle:r.quelle, status:r.status,
        paket:r.zugeordnetes_paket, notizen:r.notizen, registriertAm:r.registriert_am,
        letzteAktivitaet:r.letzte_aktivitaet, dsgvoAm:r.dsgvo_einwilligung_am, dsgvoQuelle:r.dsgvo_quelle,
        archiviert: !!r.archiviert };
    });
  }catch(err){ toast("Fehler beim Laden der Kunden: " + err.message); }
}
async function loadPartner(){
  try{
    var res = await api("/montage_partner?select=*&order=name.asc");
    if(!res.ok) throw new Error("HTTP " + res.status);
    state.partner = await res.json();
  }catch(err){ toast("Fehler beim Laden der Montage-Partner: " + err.message); }
}
async function loadProjekte(){
  try{
    var res = await api("/projekte?select=*,kunden(id,name,email),montage_partner(id,name)&order=created_at.desc");
    if(!res.ok) throw new Error("HTTP " + res.status);
    state.projekte = await res.json();
  }catch(err){ toast("Fehler beim Laden der Projekte: " + err.message); }
}

/* ---------- Speichern/Archivieren ---------- */
/* "Löschen" archiviert nur noch (archiviert=true) -- echtes Entfernen aus der
   Datenbank geht nur noch aus dem Papierkorb heraus (purgeRow), siehe unten. */
async function archiveRow(table, id){
  var res = await api("/" + table + "?id=eq." + encodeURIComponent(id), { method:"PATCH", headers:{"Prefer":"return=minimal"}, body: JSON.stringify({ archiviert: true }) });
  if(!res.ok) throw new Error("HTTP " + res.status);
}
async function restoreRow(table, id){
  var res = await api("/" + table + "?id=eq." + encodeURIComponent(id), { method:"PATCH", headers:{"Prefer":"return=minimal"}, body: JSON.stringify({ archiviert: false }) });
  if(!res.ok) throw new Error("HTTP " + res.status);
}
async function purgeRow(table, id){
  var res = await api("/" + table + "?id=eq." + encodeURIComponent(id), { method:"DELETE", headers:{"Prefer":"return=minimal"} });

  try{

    });

var ROW_TABS = ["kunden","hersteller","geraete","montage_partner","projekte"];

function formatDate(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }); }catch(e){ return iso; }
}
function formatDateTime(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }); }catch(e){ return iso; }
}
function formatEuro(n){
  if(n == null || n === "") return "—";
  try{ return Number(n).toLocaleString("de-DE", { style:"currency", currency:"EUR", maximumFractionDigits:0 }); }catch(e){ return n; }
}

/* ---------- Rendering: Tabelle je Tab ---------- */
function allRowsForTab(tab){
  return tab === "kunden" ? state.kunden : tab === "hersteller" ? state.hersteller : tab === "geraete" ? state.geraete : tab === "montage_partner" ? state.partner : state.projekte;
}
function rowsForTab(tab){
  return allRowsForTab(tab).filter(function(r){ return !!r.archiviert === state.showArchived; });
}

function currentRows(){
  var rows = rowsForTab(state.tab);
  if(state.search){
    var s = state.search.toLowerCase();
    rows = rows.filter(function(r){
      var hay = state.tab === "projekte"
        ? [(r.kunden && r.kunden.name), r.status, r.paket, r.zustaendig, (r.montage_partner && r.montage_partner.name)]
        : state.tab === "hersteller"
        ? [r.name, r.kategorien, r.konditionen]
        : state.tab === "geraete"
        ? [r.modell, r.kategorie, (r.hersteller && r.hersteller.name)]
        : [r.name, r.email, r.status, r.quelle, r.typ, r.gewerk, r.plz_bereich];
      return hay.some(function(v){ return String(v || "").toLowerCase().indexOf(s) !== -1; });
    });
  }
  if(state.sortField && SORT_ACCESSORS[state.tab] && SORT_ACCESSORS[state.tab][state.sortField]){
    var acc = SORT_ACCESSORS[state.tab][state.sortField];
    var dir = state.sortDir;
    rows = rows.slice().sort(function(a, b){
      var va = acc(a), vb = acc(b);
      if(typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
      return String(va).localeCompare(String(vb), "de", { numeric:true, sensitivity:"base" }) * dir;
    });
  }
  return rows;
}

/* ---------- Datenabgleich gegen equipment-data.js (Live-Seite) ---------- */
var EQUIPMENT_DATA_URL = "https://gym7-fit.github.io/vitaro-homegym-preview/assets/js/equipment-data.js";
var _syncData = null;

function sameNum(a, b){
  var na = (a == null || a === "") ? null : Number(a);
  var nb = (b == null || b === "") ? null : Number(b);
  if(na == null && nb == null) return true;
  if(na == null || nb == null) return false;
  return Math.abs(na - nb) < 0.005;
}
function findHerstellerIdByName(name){
  if(!name) return null;
  var n = name.trim().toLowerCase();
  var match = state.hersteller.filter(function(h){ return (h.name || "").trim().toLowerCase() === n; })[0];
  return match ? match.id : null;
}
function findGeraet(catId, catName, tier){
  return state.geraete.filter(function(g){
    var k = (g.kategorie || "").trim().toLowerCase();
    return (k === catId.toLowerCase() || k === (catName || "").trim().toLowerCase()) && g.tier === tier;
  })[0] || null;
}
async function fetchEquipmentData(){
  var res = await fetch(EQUIPMENT_DATA_URL + "?_=" + Date.now());
  if(!res.ok) throw new Error("HTTP " + res.status);
  var text = await res.text();
  var fn = new Function(text + "\nreturn (typeof VITARO_EQUIPMENT !== 'undefined') ? VITARO_EQUIPMENT : null;");
  var data = fn();
  if(!data) throw new Error("VITARO_EQUIPMENT nicht in der geladenen Datei gefunden.");
  return data;
}
function buildSyncDiffs(equipment){
  var diffs = [];
  equipment.forEach(function(cat){
    if(!cat || !cat.tiers) return;
    ["budget", "premium"].forEach(function(tier){
      var t = cat.tiers[tier];
      if(!t) return;
      var expected = { modell: t.model || "", preis: (t.price == null ? null : Number(t.price)), url: t.url || "", herstellerName: t.brand || "" };
      var g = findGeraet(cat.id, cat.name, tier);
      if(!g){
        diffs.push({ catId: cat.id, catName: cat.name, tier: tier, status: "missing", expected: expected, geraetId: null });
        return;
      }
      var currentHerstellerName = g.hersteller ? g.hersteller.name : "";
      var fieldDiffs = [];
      if((g.modell || "") !== expected.modell) fieldDiffs.push("modell");
      if(!sameNum(g.preis, expected.preis)) fieldDiffs.push("preis");
      if((g.url || "") !== expected.url) fieldDiffs.push("url");
      if(currentHerstellerName.trim().toLowerCase() !== expected.herstellerName.trim().toLowerCase()) fieldDiffs.push("hersteller");
      if(fieldDiffs.length){
        diffs.push({
          catId: cat.id, catName: cat.name, tier: tier, status: "diff", fieldDiffs: fieldDiffs,
          expected: expected, current: { modell: g.modell, preis: g.preis, url: g.url, herstellerName: currentHerstellerName },
          geraetId: g.id
        });
      }
    });
  });
  return diffs;
}
var SYNC_FIELD_LABELS = { modell: "Modell", preis: "Preis", url: "Website", hersteller: "Hersteller" };
function syncFieldValue(field, obj){
  if(field === "preis") return formatEuro(obj.preis);
  if(field === "hersteller") return obj.herstellerName || "—";
  return obj[field] || "—";
}
async function renderSyncCheck(){
  var host = document.getElementById("syncHost");
  host.innerHTML = '<div class="card" style="padding:24px;text-align:center;color:var(--ink-dim);">Lade equipment-data.js von der Live-Seite …</div>';
  try{
    var equipment = await fetchEquipmentData();
    _syncData = { equipment: equipment, diffs: buildSyncDiffs(equipment) };
    renderSyncTable();
  }catch(err){
    host.innerHTML = '<div class="card" style="padding:24px;"><p class="err" style="margin:0 0 12px;">Fehler beim Laden von equipment-data.js: ' +
      escapeHtml(err.message) + '</p><button type="button" class="btn btn-ghost btn-sm" id="syncRetryBtn">Erneut versuchen</button></div>';
    document.getElementById("syncRetryBtn").addEventListener("click", renderSyncCheck);
  }
}
function renderSyncTable(){
  var host = document.getElementById("syncHost");
  var diffs = _syncData.diffs;
  if(!diffs.length){
    host.innerHTML = '<div class="card" style="padding:24px;text-align:center;color:var(--ink-dim);">Backoffice-Gerätekatalog stimmt mit der Live-Seite überein. Keine Abweichungen gefunden.</div>' +
      '<div style="margin-top:14px;text-align:right;"><button type="button" class="btn btn-ghost btn-sm" id="syncRefreshBtn">Erneut prüfen</button></div>';
    document.getElementById("syncRefreshBtn").addEventListener("click", renderSyncCheck);
    return;
  }
  var rows = diffs.map(function(d, i){
    var badge, detail;
    if(d.status === "missing"){
      badge = '<span class="pill pill-warn">Fehlt im Backoffice</span>';
      detail = '<div class="cell-sub">Soll: ' + escapeHtml(d.expected.modell) + " · " + formatEuro(d.expected.preis) +
        (d.expected.herstellerName ? " · " + escapeHtml(d.expected.herstellerName) : "") + '</div>';
    }else{
      badge = '<span class="pill pill-warn">' + d.fieldDiffs.length + ' Feld(er) weichen ab</span>';
      detail = d.fieldDiffs.map(function(f){
        return '<div class="cell-sub">' + SYNC_FIELD_LABELS[f] + ': „' + escapeHtml(String(syncFieldValue(f, d.current))) +
          '" → „' + escapeHtml(String(syncFieldValue(f, d.expected))) + '"</div>';
      }).join("");
    }
    return '<tr>' +
      '<td>' + escapeHtml(d.catName) + '</td>' +
      '<td><span class="pill pill-' + (d.tier === "premium" ? "ok" : "neutral") + '">' + (TIER_LABELS[d.tier] || d.tier) + '</span></td>' +
      '<td>' + badge + detail + '</td>' +
      '<td><button type="button" class="btn btn-sm" data-sync-apply="' + i + '">Übernehmen</button></td>' +
      '</tr>';
  }).join("");

  host.innerHTML =
    '<div class="card" style="padding:16px 20px;margin-bottom:14px;color:var(--ink-dim);font-size:.84rem;">' +
      diffs.length + ' Abweichung(en) zwischen equipment-data.js (Live-Seite) und dem Backoffice-Gerätekatalog gefunden. „Übernehmen" schreibt den Live-Seiten-Wert ins Backoffice — nie umgekehrt.' +
    '</div>' +
    '<div class="card table-wrap"><table><thead><tr><th>Kategorie</th><th>Stufe</th><th>Abweichung</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="margin-top:14px;text-align:right;"><button type="button" class="btn btn-ghost btn-sm" id="syncRefreshBtn">Erneut prüfen</button></div>';

  document.getElementById("syncRefreshBtn").addEventListener("click", renderSyncCheck);
  host.querySelectorAll("[data-sync-apply]").forEach(function(btn){
    btn.addEventListener("click", async function(){
      var d = _syncData.diffs[Number(btn.dataset.syncApply)];
      btn.disabled = true; btn.textContent = "…";
      try{
        var herstellerId = findHerstellerIdByName(d.expected.herstellerName);
        var payload = { kategorie: d.catName, tier: d.tier, modell: d.expected.modell, preis: d.expected.preis, url: d.expected.url, hersteller_id: herstellerId };
        await saveGeraet(payload, d.geraetId);
        var msg = "Übernommen.";
        if(d.expected.herstellerName && !herstellerId) msg += " Hinweis: Hersteller \"" + d.expected.herstellerName + "\" nicht im Backoffice gefunden — bitte manuell verknüpfen.";
        toast(msg);
        await loadGeraete();
        _syncData.diffs = buildSyncDiffs(_syncData.equipment);
        renderSyncTable();
      }catch(err){ toast("Fehler: " + err.message); btn.disabled = false; btn.textContent = "Übernehmen"; }
    });
  });
}

/* ---------- Dashboard ---------- */
function statTile(label, value){
  return '<div class="card" style="padding:18px 20px;">' +
    '<div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);font-weight:700;margin-bottom:6px;">' + escapeHtml(label) + '</div>' +
    '<div style="font-family:\'Playfair Display\',serif;font-size:1.8rem;font-weight:700;">' + value + '</div></div>';
}
function statusBarRows(counts, order){
  var max = Math.max.apply(null, order.map(function(k){ return counts[k] || 0; }).concat([1]));
  return order.map(function(k){
    var n = counts[k] || 0;
    var pct = Math.round((n / max) * 100);
    var cls = STATUS_PILL[k] || "neutral";
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;">' +
      '<div style="width:170px;flex:0 0 auto;font-size:.82rem;">' + escapeHtml(k) + '</div>' +
      '<div style="flex:1;background:var(--' + cls + '-bg);border-radius:4px;overflow:hidden;height:16px;">' +
        '<div style="width:' + pct + '%;background:var(--' + cls + ');height:100%;border-radius:4px;"></div>' +
      '</div>' +
      '<div style="width:26px;text-align:right;font-weight:700;font-size:.82rem;">' + n + '</div>' +
    '</div>';
  }).join("");
}
function renderDashboard(){
  var host = document.getElementById("dashboardHost");
  var aktiveKunden = state.kunden.filter(function(k){ return !k.archiviert; });
  var aktiveProjekte = state.projekte.filter(function(p){ return !p.archiviert; });
  var offeneProjekte = aktiveProjekte.filter(function(p){ return p.status !== "Abgeschlossen"; }).length;
  var summeLaufend = aktiveProjekte.filter(function(p){ return p.status !== "Abgeschlossen"; })
    .reduce(function(s, p){ return s + (Number(p.summe) || 0); }, 0);
  var seit7 = Date.now() - 7 * 24 * 60 * 60 * 1000;
  var seit14 = Date.now() - 14 * 24 * 60 * 60 * 1000;
  var neueInteressenten = aktiveKunden.filter(function(k){
    return k.registriertAm && new Date(k.registriertAm).getTime() >= seit7;
  }).length;
  var kalt = aktiveKunden.filter(function(k){
    if(k.status === "Kunde" || k.status === "Projekt abgeschlossen") return false;
    var letzte = k.letzteAktivitaet || k.registriertAm;
    return !letzte || new Date(letzte).getTime() < seit14;
  }).length;

  var kundenStatusCounts = {};
  STATUS_OPTIONS.forEach(function(s){ kundenStatusCounts[s] = 0; });
  aktiveKunden.forEach(function(k){ var s = k.status || "Interessent"; kundenStatusCounts[s] = (kundenStatusCounts[s] || 0) + 1; });

  var projektStatusCounts = {};
  PROJEKT_STATUS_OPTIONS.forEach(function(s){ projektStatusCounts[s] = 0; });
  aktiveProjekte.forEach(function(p){ var s = p.status || "Angebot"; projektStatusCounts[s] = (projektStatusCounts[s] || 0) + 1; });

  host.innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;">' +
      statTile("Kunden gesamt", aktiveKunden.length) +
      statTile("Neue Interessenten (7 Tage)", neueInteressenten) +
      statTile("Ohne Aktivität (14+ Tage)", kalt) +
      statTile("Offene Projekte", offeneProjekte) +
      statTile("Summe laufender Angebote", formatEuro(summeLaufend)) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">' +
      '<div class="card" style="padding:20px;"><h2 style="font-size:1rem;margin-bottom:14px;">Kunden nach Status</h2>' + statusBarRows(kundenStatusCounts, STATUS_OPTIONS) + '</div>' +
      '<div class="card" style="padding:20px;"><h2 style="font-size:1rem;margin-bottom:14px;">Projekte nach Status</h2>' + statusBarRows(projektStatusCounts, PROJEKT_STATUS_OPTIONS) + '</div>' +
    '</div>' +
    '<div style="margin-top:14px;text-align:right;"><button type="button" class="btn btn-ghost btn-sm" id="dashRefreshBtn">Aktualisieren</button></div>';

  document.getElementById("dashRefreshBtn").addEventListener("click", loadAll);
}

function renderTable(){
  var rows = currentRows();
  var total = rowsForTab(state.tab).length;
  document.getElementById("countLabel").textContent = rows.length + " von " + total + " Einträgen";
  var host = document.getElementById("tableHost");

  if(!rows.length){
    host.innerHTML = '<div class="empty-state">' + (total ? "Keine Treffer für diese Suche." : "Noch keine Einträge.") + '</div>';
    wireRowActions();
    return;
  }

  var html;
  if(state.tab === "kunden") html = renderKundenTable(rows);
  else if(state.tab === "hersteller") html = renderHerstellerTable(rows);
  else if(state.tab === "geraete") html = renderGeraeteTable(rows);
  else if(state.tab === "montage_partner") html = renderPartnerTable(rows);
  else html = renderProjekteTable(rows);
  host.innerHTML = html;
  wireRowActions();
  wireSortHeaders();
}

function rowActionsCell(id){
  if(state.showArchived){
    return '<td><div class="row-actions"><button class="btn btn-ghost btn-sm" data-restore="' + id + '">Wiederherstellen</button><button class="btn btn-danger btn-sm" data-purge="' + id + '">Endgültig löschen</button></div></td></tr>';
  }
  return '<td><div class="row-actions"><button class="btn btn-ghost btn-sm" data-edit="' + id + '">Bearbeiten</button><button class="btn btn-danger btn-sm" data-delete="' + id + '">Archivieren</button></div></td></tr>';
}
function sortTh(label, field){
  var active = state.sortField === field;
  var arrow = active ? (state.sortDir === 1 ? " ▲" : " ▼") : "";
  return '<th data-sort="' + field + '" style="cursor:pointer;user-select:none;" title="Sortieren">' + escapeHtml(label) + arrow + '</th>';
}
function wireSortHeaders(){
  document.querySelectorAll("#tableHost th[data-sort]").forEach(function(th){
    th.addEventListener("click", function(){
      var field = th.dataset.sort;
      if(state.sortField === field) state.sortDir = -state.sortDir;
      else { state.sortField = field; state.sortDir = 1; }
      renderTable();

function wireRowActions(){
  document.querySelectorAll("[data-edit]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var row = rowsForTab(state.tab).filter(function(r){ return r.id === btn.dataset.edit; })[0];
      openForm(row);
    });
  });
  document.querySelectorAll("[data-delete]").forEach(function(btn){
    btn.addEventListener("click", async function(){
      if(!confirm("Wollen Sie " + DELETE_LABELS[state.tab] + " archivieren? Sie finden es danach im Papierkorb wieder.")) return;
      try{ await archiveRow(state.tab, btn.dataset.delete); toast("Archiviert."); await loadAll(); }
      catch(err){ toast("Fehler beim Archivieren: " + err.message); }
    });
  });
  document.querySelectorAll("[data-restore]").forEach(function(btn){
    btn.addEventListener("click", async function(){
      try{ await restoreRow(state.tab, btn.dataset.restore); toast("Wiederhergestellt."); await loadAll(); }
      catch(err){ toast("Fehler beim Wiederherstellen: " + err.message); }
    });
  });
  document.querySelectorAll("[data-purge]").forEach(function(btn){
    btn.addEventListener("click", async function(){
      if(!confirm("Wollen Sie " + DELETE_LABELS[state.tab] + " wirklich UNWIDERRUFLICH aus der Datenbank löschen? Das kann nicht rückgängig gemacht werden.")) return;
      try{ await purgeRow(state.tab, btn.dataset.purge); toast("Endgültig gelöscht."); await loadAll(); }
      catch(err){ toast("Fehler beim Löschen: " + err.message); }
    });
  });
}

      if(existing) await recordStatusChange("projekte", existing.id, existing.status, payload.status);
      toast(existing ? "Projekt aktualisiert." : "Projekt angelegt.");
      closeForm(); await loadAll();
    }catch(err){ toast("Fehler beim Speichern: " + err.message); }
  });

  if(existing){ await refreshPositionsHost(existing.id); renderStatusHistoryInto(document.getElementById("statusHistoryHost"), "projekte", existing.id); }
}

async function refreshPositionsHost(projektId){
  var host = document.getElementById("positionsHost");
  if(!host) return;
  var positionen;
  try{ positionen = await loadPositionen(projektId); }
  catch(err){ host.innerHTML = '<p class="err">Fehler beim Laden: ' + escapeHtml(err.message) + '</p>'; return; }

  var geraetSel = '<option value="">Gerät wählen …</option>' + state.geraete.filter(function(g){ return !g.archiviert; }).map(function(g){
    return '<option value="' + g.id + '" data-preis="' + (g.preis == null ? "" : g.preis) + '">' + escapeHtml(g.kategorie) + ' — ' + escapeHtml(g.modell) + ' (' + (TIER_LABELS[g.tier] || g.tier) + ', ' + formatEuro(g.preis) + ')</option>';
  }).join("");

  var summe = positionen.reduce(function(sum, p){ return sum + (p.menge || 0) * (p.einzelpreis || 0); }, 0);

  var rows = positionen.length
    ? positionen.map(function(p){
        var g = p.geraete;
        return '<tr>' +
          '<td>' + (g ? escapeHtml(g.kategorie) + ' — ' + escapeHtml(g.modell) : '<span class="cell-sub">Gerät gelöscht</span>') + (g && g.hersteller ? '<div class="cell-sub">' + escapeHtml(g.hersteller.name) + '</div>' : '') + '</td>' +
          '<td>' + p.menge + '</td>' +
          '<td>' + formatEuro(p.einzelpreis) + '</td>' +
          '<td>' + formatEuro((p.menge || 0) * (p.einzelpreis || 0)) + '</td>' +
          '<td><button type="button" class="btn btn-danger btn-sm" data-pos-delete="' + p.id + '">×</button></td></tr>';
      }).join("")
    : '<tr><td colspan="5" class="cell-sub">Noch keine Geräte zu diesem Projekt hinzugefügt.</td></tr>';

  host.innerHTML =
    '<div class="table-wrap" style="margin-bottom:10px;border:1px solid var(--line);border-radius:6px;">' +
    '<table><thead><tr><th>Gerät</th><th>Menge</th><th>Einzelpreis</th><th>Summe</th><th></th></tr></thead><tbody>' + rows + '</tbody>' +
    (positionen.length ? '<tfoot><tr><td colspan="3" style="text-align:right;font-weight:700;">Gesamt</td><td style="font-weight:700;">' + formatEuro(summe) + '</td><td></td></tr></tfoot>' : '') +
    '</table></div>' +
    '<div style="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;">' +
      '<select id="posGeraetSel" style="flex:1 1 200px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);">' + geraetSel + '</select>' +
      '<input type="number" id="posMenge" value="1" min="1" style="width:70px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);">' +
      '<button type="button" class="btn btn-ghost btn-sm" id="posAddBtn">+ Hinzufügen</button>' +
    '</div>';

  host.querySelectorAll("[data-pos-delete]").forEach(function(btn){
    btn.addEventListener("click", async function(){
      try{ await deletePosition(btn.dataset.posDelete); await refreshPositionsHost(projektId); }
      catch(err){ toast("Fehler beim Löschen: " + err.message); }
    });
  });
  var addBtn = document.getElementById("posAddBtn");
  if(addBtn){
    addBtn.addEventListener("click", async function(){
      var sel = document.getElementById("posGeraetSel");
      var geraetId = sel.value;
      if(!geraetId){ toast("Bitte ein Gerät auswählen."); return; }
      var menge = parseInt(document.getElementById("posMenge").value, 10) || 1;
      var preis = sel.selectedOptions[0].dataset.preis;
      try{
        await addPosition(projektId, geraetId, menge, preis === "" ? null : Number(preis));
        await refreshPositionsHost(projektId);
      }catch(err){ toast("Fehler beim Hinzufügen: " + err.message); }
    });
  }
}

/* ---------- Wiring ---------- */
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var f = e.target;
  var errEl = document.getElementById("loginError");
  errEl.hidden = true;
  var btn = f.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "Anmelden …";
  try{
    await login(f.email.value.trim(), f.password.value);
    renderShell();
    await loadAll();
  }catch(err){
    errEl.textContent = err.message;
    errEl.hidden = false;
  }
  btn.disabled = false; btn.textContent = "Anmelden";
});
document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("linksBtn").addEventListener("click", openLinksModal);
document.getElementById("addBtn").addEventListener("click", function(){ openForm(null); });
document.getElementById("refreshBtn").addEventListener("click", loadAll);
document.getElementById("exportBtn").addEventListener("click", exportCsv);
document.getElementById("trashToggleBtn").addEventListener("click", function(){
  state.showArchived = !state.showArchived;
  renderTabs();
  renderTable();
});
document.getElementById("searchInput").addEventListener("input", function(e){ state.search = e.target.value; renderTable(); });
document.querySelectorAll("#tabs button").forEach(function(btn){
  btn.addEventListener("click", function(){
    state.tab = btn.dataset.tab;
    state.search = "";
    state.sortField = null; state.sortDir = 1;
    state.showArchived = false;
    document.getElementById("searchInput").value = "";
    renderTabs();
    renderActiveTab();
  });
});

state.session = loadSession();
renderShell();
if(state.session) loadAll();
</script>
</body>
</html>
